name: Live motor learner syntax
on:
  push:
    branches:
      - feat/live-motor-learning-first-run-20261109
      - feat/motor-transfer-heldout-20261113
      - feat/motor-four-target-20261116
      - feat/four-target-oracle-audit-20261116
      - feat/resource-chain-delayed-reward-20261116
      - feat/live-resource-chain-smoke-20261116
      - feat/live-chain-frozen-neural-eval-20261117
      - feat/preregister-live-chain-multiseed-20261117
  pull_request:
    paths:
      - 'scripts/run-live-motor-learning.js'
      - 'scripts/run-live-motor-transfer.js'
      - 'src/motor-transfer-tasks.js'
      - 'test/motor-transfer-tasks.test.js'
      - 'scripts/run-live-motor-four-target.js'
      - 'src/motor-four-target-tasks.js'
      - 'test/motor-four-target-tasks.test.js'
      - 'src/motor-four-target-baselines.js'
      - 'test/motor-four-target-baselines.test.js'
      - 'scripts/audit-four-target-oracle.js'
      - 'src/motor-resource-chain.js'
      - 'test/motor-resource-chain.test.js'
      - 'scripts/diagnose-resource-chain.js'
      - 'src/resource-chain-q.js'
      - 'src/resource-chain-simulator.js'
      - 'scripts/audit-resource-chain-causality.js'
      - 'scripts/preflight-resource-chain-live.js'
      - 'scripts/run-live-resource-chain-smoke.js'
      - 'scripts/check-resource-chain-gate.js'
      - 'scripts/inspect-resource-chain-failure.js'
      - 'src/verified-motor-baseline-action.js'
      - 'test/verified-motor-baseline-action.test.js'
      - 'src/resource-chain-offline-checkpoint.js'
      - 'scripts/build-resource-chain-frozen-policy.js'
      - 'test/resource-chain-offline-checkpoint.test.js'
      - 'src/resource-chain-live-result.js'
      - 'test/resource-chain-live-result.test.js'
      - 'scripts/audit-live-resource-chain-pair.js'
      - 'src/resource-chain-benchmark-plan.js'
      - 'test/resource-chain-benchmark-plan.test.js'
      - 'scripts/build-resource-chain-benchmark-checkpoint.js'
      - 'scripts/run-live-resource-chain-multi-trial.js'
      - 'scripts/audit-live-resource-chain-trial.js'
      - 'scripts/run-resource-chain-benchmark.js'
      - 'scripts/audit-resource-chain-first-action.js'
      - 'src/motor-resource-pickup-proof.js'
      - 'test/motor-resource-pickup-proof.test.js'
      - 'test/resource-chain-q.test.js'
      - '.github/workflows/live-motor-learner.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/run-live-motor-learning.js
      - run: node --check scripts/run-live-motor-transfer.js
      - run: node --test test/motor-transfer-tasks.test.js
      - run: node --check scripts/run-live-motor-four-target.js
      - run: node --test test/motor-four-target-tasks.test.js
      - run: node scripts/diagnose-motor-four-target.js
      - run: node --check scripts/audit-four-target-oracle.js
      - run: node --test test/motor-four-target-baselines.test.js
      - run: node --test test/motor-resource-chain.test.js
      - run: node --test test/resource-chain-q.test.js
      - run: node scripts/diagnose-resource-chain.js
      - run: node scripts/audit-resource-chain-causality.js
      - run: node --check scripts/preflight-resource-chain-live.js
      - run: node --check scripts/run-live-resource-chain-smoke.js
      - run: node --check scripts/check-resource-chain-gate.js
      - run: node --check scripts/inspect-resource-chain-failure.js
      - run: node --test test/motor-resource-pickup-proof.test.js
      - run: node --test test/verified-motor-baseline-action.test.js
      - run: node --test test/resource-chain-offline-checkpoint.test.js
      - run: node --test test/resource-chain-live-result.test.js
      - run: node --check scripts/audit-live-resource-chain-pair.js
      - run: node --test test/resource-chain-benchmark-plan.test.js
      - run: node --check scripts/build-resource-chain-benchmark-checkpoint.js
      - run: node --check scripts/run-live-resource-chain-multi-trial.js
      - run: node --check scripts/audit-live-resource-chain-trial.js
      - run: node --check scripts/run-resource-chain-benchmark.js
      - run: node scripts/run-resource-chain-benchmark.js --plan-only true --suite-id chain-multiseed-ci
      - run: node scripts/build-resource-chain-benchmark-checkpoint.js --benchmark true --mode trained --seed 101 --episodes 600 --self-test true
      - run: node scripts/build-resource-chain-benchmark-checkpoint.js --benchmark true --mode untrained --seed 101 --episodes 600 --self-test true
      - run: node --check scripts/build-resource-chain-frozen-policy.js
      - run: node scripts/build-resource-chain-frozen-policy.js --mode trained --seed 17 --episodes 600
      - run: node scripts/run-live-resource-chain-smoke.js --self-test true --policy trained --checkpoint recordings/resource-chain-offline-checkpoints/chain-trained-seed17-600.json --rotation 2 --variant skewed
      - run: node scripts/build-resource-chain-frozen-policy.js --mode untrained --seed 17 --episodes 600
      - run: node scripts/run-live-resource-chain-smoke.js --self-test true --policy untrained --checkpoint recordings/resource-chain-offline-checkpoints/chain-untrained-seed17-0.json --rotation 3 --variant base
      - run: node scripts/build-resource-chain-frozen-policy.js --mode trained --seed 23 --episodes 600
      - run: node scripts/run-live-resource-chain-smoke.js --self-test true --policy trained --checkpoint recordings/resource-chain-offline-checkpoints/chain-trained-seed23-600.json --rotation 2 --variant base
      - run: node scripts/build-resource-chain-frozen-policy.js --mode untrained --seed 23 --episodes 600
      - run: node scripts/run-live-resource-chain-smoke.js --self-test true --policy untrained --checkpoint recordings/resource-chain-offline-checkpoints/chain-untrained-seed23-0.json --rotation 2 --variant base
      - run: node --check scripts/audit-resource-chain-first-action.js
      - run: node scripts/run-live-resource-chain-smoke.js --self-test true
      - run: node scripts/diagnose-motor-transfer.js
      - run: node --check scripts/fix-paper-same-tick-proof.cjs
      - run: node scripts/diagnose-motor-q-learning.js

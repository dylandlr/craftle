name: Live motor learner syntax
on:
  push:
    branches:
      - feat/live-motor-learning-first-run-20261109
      - feat/motor-transfer-heldout-20261113
      - feat/motor-four-target-20261116
      - feat/four-target-oracle-audit-20261116
      - feat/resource-chain-delayed-reward-20261116
  pull_request:
    paths:
      - 'scripts/run-live-motor-learning.js'
      - 'scripts/run-live-motor-transfer.js'
      - 'src/motor-transfer-tasks.js'
      - 'test/motor-transfer-tasks.test.js'
      - 'scripts/run-live-motor-four-target.js'
      - 'src/motor-four-target-tasks.js'
      - 'test/motor-four-target-tasks.test.js'
      - 'src/motor-four-target-baselines.js'
      - 'test/motor-four-target-baselines.test.js'
      - 'scripts/audit-four-target-oracle.js'
      - 'src/motor-resource-chain.js'
      - 'test/motor-resource-chain.test.js'
      - 'scripts/diagnose-resource-chain.js'
      - 'src/resource-chain-q.js'
      - 'src/resource-chain-simulator.js'
      - 'scripts/audit-resource-chain-causality.js'
      - 'scripts/preflight-resource-chain-live.js'
      - 'test/resource-chain-q.test.js'
      - '.github/workflows/live-motor-learner.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/run-live-motor-learning.js
      - run: node --check scripts/run-live-motor-transfer.js
      - run: node --test test/motor-transfer-tasks.test.js
      - run: node --check scripts/run-live-motor-four-target.js
      - run: node --test test/motor-four-target-tasks.test.js
      - run: node scripts/diagnose-motor-four-target.js
      - run: node --check scripts/audit-four-target-oracle.js
      - run: node --test test/motor-four-target-baselines.test.js
      - run: node --test test/motor-resource-chain.test.js
      - run: node --test test/resource-chain-q.test.js
      - run: node scripts/diagnose-resource-chain.js
      - run: node scripts/audit-resource-chain-causality.js
      - run: node --check scripts/preflight-resource-chain-live.js
      - run: node scripts/diagnose-motor-transfer.js
      - run: node --check scripts/fix-paper-same-tick-proof.cjs
      - run: node scripts/diagnose-motor-q-learning.js

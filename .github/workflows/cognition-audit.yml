name: Nine cognition treatment contract audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/cognition-config.js'
      - 'src/llm-cognition.js'
      - 'src/llm-agent.js'
      - 'scripts/audit-cognition-factorial.js'
      - '.github/workflows/cognition-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/audit-cognition-factorial.js recordings/cognition-audit/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognition-contract-audit-${{ github.run_id }}
          path: recordings/cognition-audit/report.json
          retention-days: 7

name: Recording pipeline validation
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recording-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install pillow==11.3.0
      - name: Encode labeled telemetry fixture
        run: |
          mkdir -p recordings/fixture
          printf '%s\n' '{"kind":"experiment_started"}' '{"kind":"spawn","agent":"agent_001"}' '{"kind":"decision","agent":"agent_001","action":"explore"}' > recordings/fixture/events.jsonl
          python scripts/record-run.py --log recordings/fixture/events.jsonl --out recordings/fixture/out
          test -s recordings/fixture/out/telemetry.mp4
          test -s recordings/fixture/out/manifest.json
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 recordings/fixture/out/telemetry.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recording-fixture-${{ github.run_id }}
          path: recordings/fixture/
          retention-days: 7

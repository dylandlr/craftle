name: Neural assisted-option learning pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/learned-options.yml', 'src/option-dqn.js', 'src/learning-options.js', 'src/survival-reference.js', 'src/recording.js', 'scripts/encode-reference-video.py', 'src/recorded-frame-decoder.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripted-reference:
    strategy:
      fail-fast: false
      matrix:
        scenario: [natural, food-fixture]
        seed: ['20261205']
        epsilon: ['0.30', '0.70']
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Mineflayer and renderer
        run: |
          mkdir -p recordings/survival-reference
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dev libxi-dev libxext-dev libx11-dev libglu1-mesa-dev python3-pil
          npm install --no-audit --no-fund
          npm install --no-save 'github:PrismarineJS/node-canvas-webgl'
          npm run configure
          npm test
      - name: Launch Minecraft server
        run: |
          docker run -d --name craftle-reference -p 25565:25565 -e EULA=TRUE -e ONLINE_MODE=FALSE -e MAX_PLAYERS=2 -e MEMORY=2G -e TYPE=PAPER -e VERSION=1.21.1 -e MODE=survival -e DIFFICULTY=normal -e SEED=${{ matrix.seed }} itzg/minecraft-server:java21
          for i in $(seq 1 120); do
            if docker logs craftle-reference 2>&1 | grep -Fq 'For help, type "help"'; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run neural options over scripted primitives
        env:
          CRAFTLE_AGENT_IDS: agent_001
          CRAFTLE_BEHAVIOR: learned_survival_options
          CRAFTLE_OPTION_COMMITMENT_STEPS: '4'
          CRAFTLE_OPTION_REWARD_VERSION: 'v2'
          CRAFTLE_OPTION_EPSILON: ${{ matrix.epsilon }}
          CRAFTLE_RL_MAX_MS: '180000'
          CRAFTLE_REFERENCE_VIDEO_DIR: recordings/survival-reference
          CRAFTLE_RECORD_FRAMES: '20000'
          CRAFTLE_CAPTURE_TELEMETRY: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          mkdir -p recordings/survival-reference
          timeout --signal=TERM --kill-after=8s 200s xvfb-run -a node src/main.js > recordings/survival-reference/agent.log 2>&1 &
          agent_pid=$!
          if [ "$SCENARIO" = food-fixture ]; then
            for i in $(seq 1 40); do
              if grep -q '"type":"spawn"' recordings/survival-reference/agent.log; then break; fi
              sleep 1
            done
            docker exec craftle-reference rcon-cli "forceload add -16 -16 16 16"
            sleep 3
            docker exec craftle-reference rcon-cli "fill -7 80 -7 7 85 7 stone hollow"
            docker exec craftle-reference rcon-cli "fill -6 81 -6 6 86 6 air"
            docker exec craftle-reference rcon-cli "tp Turesla 0 81 0"
            docker exec craftle-reference rcon-cli 'summon sheep 1 81 0 {NoAI:1b}'
            docker exec craftle-reference rcon-cli 'summon sheep -1 81 0 {NoAI:1b}'
            docker exec craftle-reference rcon-cli "effect give Turesla minecraft:hunger 15 20 true"
          fi
          wait "$agent_pid" || status=$?
          grep -E '"type":"survival_reference_(hunt|consumed|error)"' recordings/survival-reference/agent.log || true
          if [ "$SCENARIO" = food-fixture ]; then
            # Food acquisition is the experiment outcome, not a prerequisite for valid RL execution.
            # Keep a strictly observed pass/fail behavioral metric in each recorded trial.
            if grep -q '"type":"survival_reference_consumed"' recordings/survival-reference/agent.log; then
              echo 'FOOD_FIXTURE_MEAL_OBSERVED=true' | tee recordings/survival-reference/behavioral-outcome.txt
            else
              echo 'FOOD_FIXTURE_MEAL_OBSERVED=false' | tee recordings/survival-reference/behavioral-outcome.txt
            fi
          fi
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then exit 1; fi
          grep -q '"type":"survival_reference_started"' recordings/survival-reference/agent.log
          test "$(grep -c '"type":"survival_reference_action"' recordings/survival-reference/agent.log)" -ge 3
          node scripts/report-survival-reference.js recordings/survival-reference/agent.log > recordings/survival-reference/summary.json
          node scripts/report-option-behavior.js recordings/survival-reference/agent.log > recordings/survival-reference/option-behavior.json
          cat recordings/survival-reference/option-behavior.json
          cat recordings/survival-reference/summary.json
          grep -q '"type":"option_decision"' recordings/survival-reference/agent.log
          grep -q '"type":"option_transition"' recordings/survival-reference/agent.log
          test -s recordings/options/policy.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checkpoint=JSON.parse(fs.readFileSync('recordings/options/policy.json','utf8'));
          const events=fs.readFileSync('recordings/survival-reference/agent.log','utf8').split('\n').filter(line=>line.startsWith('{"timestamp":')).map(line=>JSON.parse(line));
          const transitions=events.filter(e=>e.type==='option_transition').length;
          const terminals=events.filter(e=>e.type==='option_terminal').length;
          const decisions=events.filter(e=>e.type==='option_decision');
          if(checkpoint.updates<=0||checkpoint.updates!==4*(transitions+terminals))throw Error('Neural update/checkpoint accounting failed');
          console.log(JSON.stringify({type:'neural_learning_audit',schema:checkpoint.schema,updates:checkpoint.updates,transitions,terminals,decisions:decisions.length,actions:Object.fromEntries(checkpoint.options.map(action=>[action,decisions.filter(e=>e.action===action).length]))}));
          NODE
      - name: Encode full sampled POV using capture timestamps
        if: always()
        run: python3 scripts/encode-reference-video.py recordings/survival-reference
      - name: Archive logs
        if: always()
        run: |
          mkdir -p recordings/survival-reference
          docker logs craftle-reference > recordings/survival-reference/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        id: trial_video_artifact
        if: always()
        with:
          name: neural-options-${{ matrix.scenario }}-${{ matrix.seed }}-eps${{ matrix.epsilon }}-${{ github.run_id }}
          path: recordings
          retention-days: 30
      - name: Add full gameplay links to run summary
        if: always()
        env:
          VIDEO_ARTIFACT_ID: ${{ steps.trial_video_artifact.outputs.artifact-id }}
          SCENARIO: ${{ matrix.scenario }}
          EPSILON: ${{ matrix.epsilon }}
          SEED: ${{ matrix.seed }}
        run: |
          {
            echo "### Full Minecraft POV — $SCENARIO / epsilon $EPSILON / world $SEED"
            echo ""
            if [ -n "$VIDEO_ARTIFACT_ID" ]; then
              echo "[Download full recording, annotated copy, raw frames, and logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$VIDEO_ARTIFACT_ID)"
            else
              echo "Artifact upload did not produce a recording link."
            fi
            if [ -s recordings/survival-reference/video-timing.json ]; then
              echo ""
              echo '#### Capture coverage'
              echo '~~~json'
              cat recordings/survival-reference/video-timing.json
              echo '~~~'
            else
              echo ""
              echo "Video timing unavailable; do not claim complete playback."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

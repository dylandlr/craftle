name: Nine-agent shared-world POV
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shared-nine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb libgl1-mesa-dev libxi-dev libxext-dev libx11-dev libglu1-mesa-dev
          npm install --no-audit --no-fund
          npm install --no-save 'github:PrismarineJS/node-canvas-webgl'
          npm run configure
          node scripts/validate-world-mode.js shared
      - name: Start one world
        run: |
          docker run -d --name craftle-nine -p 25565:25565 -e EULA=TRUE -e ONLINE_MODE=FALSE -e MAX_PLAYERS=12 -e MEMORY=2G -e TYPE=PAPER -e VERSION=1.21.1 itzg/minecraft-server:java21
          for i in $(seq 1 120); do
            if docker logs craftle-nine 2>&1 | grep -Fq 'For help, type "help"'; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Nine independent POV processes
        env:
          CRAFTLE_RECORD_POV: '1'
          CRAFTLE_RECORD_FRAMES: '120'
          CRAFTLE_RECORD_SIZE: '384'
          CRAFTLE_RECORD_DIRECTORY: recordings/shared/pov
          CRAFTLE_CAMERA_SWEEP: '0'
          CRAFTLE_BEHAVIOR: 'explore'
          CRAFTLE_CAPTURE_TELEMETRY: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          CRAFTLE_CAPTURE_BARRIER: recordings/shared/capture-start.txt
        run: |
          mkdir -p recordings/shared/pov
          pids=()
          for n in $(seq -w 1 9); do
            id=$(printf "agent_%03d" "$n")
            CRAFTLE_AGENT_IDS="$id" timeout --signal=TERM 300s xvfb-run -a node src/main.js > "recordings/shared/$id.log" 2>&1 &
            pids+=("$!")
            sleep 12
          done
          ready=0
          for attempt in $(seq 1 240); do
            ready=0
            for log in recordings/shared/agent_*.log; do
              if grep -q '"type":"capture_waiting"' "$log"; then ready=$((ready+1)); fi
            done
            if [ "$ready" -eq 9 ]; then break; fi
            sleep 1
          done
          echo "Agents waiting at capture barrier: $ready / 9"
          if [ "$ready" -eq 9 ]; then
            date -u +%Y-%m-%dT%H:%M:%S.%NZ > recordings/shared/capture-start.txt
          else
            echo "ERROR: Not all nine agents spawned; refusing unsynchronized recording" >&2
            exit 1
          fi
          for pid in "${pids[@]}"; do wait "$pid" || true; done
          for log in recordings/shared/agent_*.log; do
            echo "=== $log ==="
            grep -E '"type":"(spawn|kicked|error|pov_capture_started|pov_capture_failed|disconnected)"' "$log" | tail -n 20 || true
          done
          node scripts/verify-pov.js recordings/shared/pov config.json
          python3 scripts/verify-motion.py recordings/shared/pov --min-different-frames 2
          python3 scripts/verify-capture-timing.py recordings/shared --expected 9 --max-start-skew-ms 500
          python3 scripts/verify-pose-timeline.py recordings/shared --expected 9
          python3 scripts/verify-displacement.py recordings/shared --expected 9 --min-moving-agents 5 --min-displacement 0.5
          python3 scripts/compose-grid.py recordings/shared/pov recordings/shared/grid.mp4 --seconds 5
      - name: Report resource usage
        if: always()
        run: |
          mkdir -p recordings/shared
          docker stats --no-stream craftle-nine > recordings/shared/resource-stats.txt 2>&1 || true
          free -h >> recordings/shared/resource-stats.txt || true
      - name: Save server evidence
        if: always()
        run: |
          mkdir -p recordings/shared
          docker logs craftle-nine > recordings/shared/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nine-agent-shared-world-${{ github.run_id }}
          path: recordings/shared
          retention-days: 7

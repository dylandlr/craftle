name: Build Fabric camera director
on:
  push:
    paths:
      - 'mods/craftle-camera-director/**'
      - '.github/workflows/craftle-camera-director.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build client mod
        run: gradle --no-daemon build
        working-directory: mods/craftle-camera-director
      - uses: actions/upload-artifact@v4
        with:
          name: craftle-camera-director-fabric-1.21.1
          path: mods/craftle-camera-director/build/libs/*.jar
          if-no-files-found: error

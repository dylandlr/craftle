name: Continuous Craftle v3 learning
on:
  push:
    branches: [main]
    paths: ['.github/workflows/continuous-learning.yml', 'scripts/audit-option-checkpoint.js', 'scripts/checkpoint-lineage.js']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: craftle-continuous-v3-main
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  scripted-reference:
    strategy:
      fail-fast: false
      matrix:
        scenario: [natural]
        seed: ['20261205']
        epsilon: ['0.30']
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Mineflayer and renderer
        run: |
          mkdir -p recordings/survival-reference
          sudo apt-get update -qq
          sudo apt-get install -y xvfb ffmpeg libgl1-mesa-dev libxi-dev libxext-dev libx11-dev libglu1-mesa-dev python3-pil
          npm install --no-audit --no-fund
          npm install --no-save 'github:PrismarineJS/node-canvas-webgl'
          npm run configure
          npm test
      - name: Restore latest validated continuous experiment artifact
        id: checkpoint_source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p recordings/options
          runs=$(gh api "repos/$GH_REPO/actions/workflows/continuous-learning.yml/runs?status=success&per_page=30")
          previous=$(echo "$runs" | jq -r --arg current "$CURRENT_RUN" '[.workflow_runs[] | select((.id|tostring)!=$current)] | sort_by(.created_at,.id) | reverse | .[].id' )
          recovered=0
          for run in $previous; do
            artifacts=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts?per_page=100")
            artifact=$(echo "$artifacts" | jq -r --arg run "$run" '.artifacts[] | select(.expired==false and (.name|startswith("continuous-v3-natural-")) and (.name|endswith("-"+$run))) | .name' | head -1)
            if [ -z "$artifact" ]; then continue; fi
            mkdir -p "recordings/recovery/$run"
            if ! gh run download "$run" --repo "$GH_REPO" --name "$artifact" --dir "recordings/recovery/$run"; then continue; fi
            candidate="recordings/recovery/$run/options/policy.json"
            lineage="recordings/recovery/$run/options/lineage.json"
            if [ ! -s "$candidate" ] || [ ! -s "$lineage" ]; then continue; fi
            cp "$candidate" recordings/options/policy.json
            cp "$lineage" recordings/options/lineage.json
            echo "key=craftle-options-v3-structured7-assisted4-commit4-audited-v1-$run-1" >> "$GITHUB_OUTPUT"
            echo "source=verified-artifact-$run" >> "$GITHUB_OUTPUT"
            recovered=1
            break
          done
          if [ "$recovered" -ne 1 ]; then
            echo "No validated predecessor artifact available. Failing closed rather than silently cold-starting." >&2
            exit 1
          fi
      - name: Verify predecessor checkpoint identity
        env:
          RESTORED_KEY: ${{ steps.checkpoint_source.outputs.key }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          node scripts/checkpoint-lineage.js verify recordings/options/policy.json recordings/options/lineage.json "$RESTORED_KEY" "$CURRENT_RUN"
      - name: Verify warm-start cache identity
        run: |
          if [ -s recordings/options/policy.json ]; then
            echo "RESTORED_CHECKPOINT_KEY=${{ steps.checkpoint_source.outputs.key }}"
          else
            echo "No prior checkpoint cache available: this is a cold start, not proof of continuity."
          fi
      - name: Verify complete restored state if present
        run: |
          if [ -s recordings/options/policy.json ]; then
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('recordings/options/policy.json','utf8'));
          if(c.updates>=304 && (!c.trainingState || !Array.isArray(c.trainingState.replay) || !Number.isSafeInteger(c.trainingState.rngState) || !Array.isArray(c.trainingState.tw) || !Array.isArray(c.trainingState.tv)))throw Error('Resumed 304+ checkpoint lacks full training state');
          console.log(JSON.stringify({type:'restored_training_state',updates:c.updates,replaySize:c.trainingState?.replay?.length??null,complete:Boolean(c.trainingState)}));
          NODE
          fi
      - name: Record incoming checkpoint provenance
        run: |
          mkdir -p recordings/experiment
          printf '{"schema":"craftle.continuous.v1","runId":"%s","priorCacheKey":"%s","gitSha":"%s","server":"PAPER","version":"1.21.1","policy":"training","reward":"v3","episodeSeconds":180}\n' \
            "${{ github.run_id }}" "${{ steps.checkpoint_source.outputs.key }}" "${{ github.sha }}" > recordings/experiment/lineage.json
          node scripts/audit-option-checkpoint.js capture recordings/options/policy.json recordings/experiment/incoming-checkpoint.json
          if [ -f recordings/options/policy.json ]; then
            sha256sum recordings/options/policy.json > recordings/experiment/incoming-policy.sha256
          else
            echo "COLD_START" > recordings/experiment/incoming-policy.sha256
          fi
      - name: Launch Minecraft server
        run: |
          docker run -d --name craftle-reference -p 25565:25565 -e EULA=TRUE -e ONLINE_MODE=FALSE -e MAX_PLAYERS=2 -e MEMORY=2G -e TYPE=PAPER -e VERSION=1.21.1 -e MODE=survival -e DIFFICULTY=normal -e SEED=${{ matrix.seed }} itzg/minecraft-server:java21
          for i in $(seq 1 120); do
            if docker logs craftle-reference 2>&1 | grep -Fq 'For help, type "help"'; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Run neural options over scripted primitives
        id: training_episode
        env:
          CRAFTLE_AGENT_IDS: agent_001
          CRAFTLE_BEHAVIOR: learned_survival_options
          CRAFTLE_OPTION_COMMITMENT_STEPS: '4'
          CRAFTLE_OPTION_REWARD_VERSION: 'v3'
          CRAFTLE_OPTION_EPSILON: ${{ matrix.epsilon }}
          CRAFTLE_RL_MAX_MS: '180000'
          CRAFTLE_REFERENCE_VIDEO_DIR: recordings/survival-reference
          CRAFTLE_RECORD_FRAMES: '20000'
          CRAFTLE_CAPTURE_TELEMETRY: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          SCENARIO: ${{ matrix.scenario }}
        run: |
          mkdir -p recordings/survival-reference
          timeout --signal=TERM --kill-after=8s 200s xvfb-run -a node src/main.js > recordings/survival-reference/agent.log 2>&1 &
          agent_pid=$!
          if [ "$SCENARIO" = food-fixture ]; then
            for i in $(seq 1 40); do
              if grep -q '"type":"spawn"' recordings/survival-reference/agent.log; then break; fi
              sleep 1
            done
            docker exec craftle-reference rcon-cli "forceload add -16 -16 16 16"
            sleep 3
            docker exec craftle-reference rcon-cli "fill -7 80 -7 7 85 7 stone hollow"
            docker exec craftle-reference rcon-cli "fill -6 81 -6 6 86 6 air"
            docker exec craftle-reference rcon-cli "tp Turesla 0 81 0"
            docker exec craftle-reference rcon-cli 'summon sheep 1 81 0 {NoAI:1b}'
            docker exec craftle-reference rcon-cli 'summon sheep -1 81 0 {NoAI:1b}'
            docker exec craftle-reference rcon-cli "effect give Turesla minecraft:hunger 15 20 true"
          fi
          wait "$agent_pid" || status=$?
          grep -E '"type":"survival_reference_(hunt|consumed|error)"' recordings/survival-reference/agent.log || true
          if [ "$SCENARIO" = food-fixture ]; then
            # Food acquisition is the experiment outcome, not a prerequisite for valid RL execution.
            # Keep a strictly observed pass/fail behavioral metric in each recorded trial.
            if grep -q '"type":"survival_reference_consumed"' recordings/survival-reference/agent.log; then
              echo 'FOOD_FIXTURE_MEAL_OBSERVED=true' | tee recordings/survival-reference/behavioral-outcome.txt
            else
              echo 'FOOD_FIXTURE_MEAL_OBSERVED=false' | tee recordings/survival-reference/behavioral-outcome.txt
            fi
          fi
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 124 ]; then exit 1; fi
          grep -q '"type":"survival_reference_started"' recordings/survival-reference/agent.log
          test "$(grep -c '"type":"survival_reference_action"' recordings/survival-reference/agent.log)" -ge 3
          node scripts/report-survival-reference.js recordings/survival-reference/agent.log > recordings/survival-reference/summary.json
          node scripts/report-option-behavior.js recordings/survival-reference/agent.log > recordings/survival-reference/option-behavior.json
          cat recordings/survival-reference/option-behavior.json
          cat recordings/survival-reference/summary.json
          grep -q '"type":"option_decision"' recordings/survival-reference/agent.log
          grep -q '"type":"option_transition"' recordings/survival-reference/agent.log
          test -s recordings/options/policy.json
      - name: Verify resumed checkpoint accounting
        id: checkpoint_audit
        run: |
          node scripts/audit-option-checkpoint.js verify recordings/options/policy.json recordings/survival-reference/agent.log recordings/experiment/incoming-checkpoint.json recordings/experiment/checkpoint-audit.json
      - name: Audit verified-outcome reward links
        id: reward_audit
        if: always()
        run: |
          if [ -s recordings/survival-reference/agent.log ]; then
            node scripts/audit-v3-rewards.js recordings/survival-reference/agent.log | tee recordings/survival-reference/reward-v3-audit.json
          else
            echo '{"status":"missing_live_agent_log"}' > recordings/survival-reference/reward-v3-audit.json
          fi
      - name: Summarize verified reward evidence
        if: always()
        run: |
          if [ -f recordings/survival-reference/agent.log ]; then
            echo '### Verified outcome reward evidence' >> "$GITHUB_STEP_SUMMARY"
            grep -c '"type":"option_verified_reward"' recordings/survival-reference/agent.log >> "$GITHUB_STEP_SUMMARY" || true
            echo 'Events above are credited only when a matching option-instance ledger event is verified; zero is a valid negative outcome.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Encode full sampled POV using capture timestamps
        id: video_evidence
        if: always()
        run: python3 scripts/encode-reference-video.py recordings/survival-reference
      - name: Stamp outgoing checkpoint lineage
        if: success() && steps.checkpoint_audit.outcome == 'success' && steps.reward_audit.outcome == 'success'
        run: node scripts/checkpoint-lineage.js write recordings/options/policy.json recordings/options/lineage.json unused ${{ github.run_id }} ${{ github.run_attempt }}
      - name: Save validated training checkpoint
        id: promote_checkpoint
        if: success() && steps.checkpoint_audit.outcome == 'success' && steps.reward_audit.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            recordings/options/policy.json
            recordings/options/lineage.json
          key: craftle-options-v3-structured7-assisted4-commit4-audited-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record outgoing checkpoint
        if: always()
        env:
          CHECKPOINT_AUDIT: ${{ steps.checkpoint_audit.outcome }}
          REWARD_AUDIT: ${{ steps.reward_audit.outcome }}
          TRAINING_EPISODE: ${{ steps.training_episode.outcome }}
          VIDEO_EVIDENCE: ${{ steps.video_evidence.outcome }}
          CACHE_SAVE: ${{ steps.promote_checkpoint.outcome }}
        run: |
          mkdir -p recordings/experiment
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks=Object.fromEntries(['TRAINING_EPISODE','CHECKPOINT_AUDIT','REWARD_AUDIT','VIDEO_EVIDENCE','CACHE_SAVE'].map(key=>[key,process.env[key]||'not_run']));
          fs.writeFileSync('recordings/experiment/promotion-status.json',JSON.stringify({schema:'craftle.checkpoint-promotion.v1',checks,note:'Cache save outcome is not a guarantee of future cache retention.'},null,2)+'\n');
          NODE
          if [ -s recordings/options/policy.json ]; then
            sha256sum recordings/options/policy.json > recordings/experiment/outgoing-policy.sha256
          fi
      - name: Archive logs
        if: always()
        run: |
          mkdir -p recordings/survival-reference
          docker logs craftle-reference > recordings/survival-reference/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        id: trial_video_artifact
        if: always()
        with:
          name: continuous-v3-${{ matrix.scenario }}-${{ matrix.seed }}-eps${{ matrix.epsilon }}-${{ github.run_id }}
          path: recordings
          retention-days: 30
      - name: Add full gameplay links to run summary
        if: always()
        env:
          VIDEO_ARTIFACT_ID: ${{ steps.trial_video_artifact.outputs.artifact-id }}
          SCENARIO: ${{ matrix.scenario }}
          EPSILON: ${{ matrix.epsilon }}
          SEED: ${{ matrix.seed }}
        run: |
          {
            echo "### Full Minecraft POV — $SCENARIO / epsilon $EPSILON / world $SEED"
            echo ""
            if [ -n "$VIDEO_ARTIFACT_ID" ]; then
              echo "[Download full recording, annotated copy, raw frames, and logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/$VIDEO_ARTIFACT_ID)"
            else
              echo "Artifact upload did not produce a recording link."
            fi
            if [ -s recordings/survival-reference/video-timing.json ]; then
              echo ""
              echo '#### Capture coverage'
              echo '~~~json'
              cat recordings/survival-reference/video-timing.json
              echo '~~~'
            else
              echo ""
              echo "Video timing unavailable; do not claim complete playback."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

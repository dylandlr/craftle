name: Persistent world recreation and agent image
on:
  push:
    branches: [main]
    paths: ['deploy/persistent/**', 'src/persistent-session.js', 'scripts/persistent-agent.js', '.github/workflows/persistent-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world_recreation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CRAFTLE_MC_MEMORY: '2G'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize persistent paths and validate Compose
        run: |
          node scripts/init-persistent.js
          docker compose -f deploy/persistent/compose.yml config -q
      - name: Verify world state survives container replacement
        run: |
          mkdir -p persistence-evidence
          compose() { docker compose -f deploy/persistent/compose.yml "$@"; }
          ready() {
            for i in $(seq 1 120); do
              if compose exec -T minecraft mc-health >/dev/null 2>&1; then return 0; fi
              sleep 3
            done
            return 1
          }
          compose up -d minecraft
          ready
          compose exec -T minecraft rcon-cli 'scoreboard objectives add craftle_persist dummy'
          compose exec -T minecraft rcon-cli 'scoreboard players set persistence_probe craftle_persist 123456'
          compose exec -T minecraft rcon-cli 'save-all flush'
          compose logs --no-color minecraft > persistence-evidence/before-recreation.log
          compose stop minecraft
          compose rm -f minecraft
          test -f deploy/persistent/state/server/world/level.dat
          compose up -d minecraft
          ready
          compose exec -T minecraft rcon-cli 'scoreboard players get persistence_probe craftle_persist' | tee persistence-evidence/after-recreation-probe.txt
          grep -q '123456' persistence-evidence/after-recreation-probe.txt
      - name: Archive independent server evidence
        if: always()
        run: |
          mkdir -p persistence-evidence
          docker compose -f deploy/persistent/compose.yml logs --no-color minecraft > persistence-evidence/after-recreation.log 2>&1 || true
          docker compose -f deploy/persistent/compose.yml images --format json > persistence-evidence/images.json || true
          docker compose -f deploy/persistent/compose.yml down || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistent-world-recreation-${{ github.run_id }}
          path: persistence-evidence
          retention-days: 30
  agent_image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build agent with native renderer dependencies
        run: docker build -f deploy/persistent/agent.Dockerfile -t craftle-persistent-agent:test .
      - name: Validate renderer loads and all unit tests pass inside image
        run: |
          docker run --rm --entrypoint xvfb-run craftle-persistent-agent:test -a node --input-type=module -e 'await import("node-canvas-webgl"); await import("./src/persistent-session.js"); console.log("Native renderer and session runner imports passed")'
          docker run --rm -v "$PWD/test:/app/test:ro" --entrypoint bash craftle-persistent-agent:test -lc 'npm run configure && npm test'

name: craftle-filming
services:
  minecraft:
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    ports:
      - '127.0.0.1:25575:25565'
    environment:
      EULA: 'TRUE'
      TYPE: VANILLA
      VERSION: '1.21.1'
      ONLINE_MODE: 'FALSE'
      DIFFICULTY: normal
      MODE: survival
      SEED: '20261205'
      SPAWN_PROTECTION: '0'
      ENABLE_RCON: 'true'
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      MAX_PLAYERS: '4'
    volumes:
      - ./state/server:/data
    secrets:
      - rcon_password
    healthcheck:
      test: ['CMD','mc-health']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
  agent:
    profiles: [learning]
    build:
      context: ../..
      dockerfile: deploy/persistent/agent.Dockerfile
      args:
        CRAFTLE_CUSTOM_VIEWER: '0'
        CRAFTLE_ANIMATED_VIEWER: '0'
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    ports:
      - '127.0.0.1:3010:3000'
      - '127.0.0.1:3011:3001'
    environment:
      CRAFTLE_PERSISTENT_ROOT: /state/agent
      CRAFTLE_SERVER_HOST: minecraft
      CRAFTLE_SERVER_PORT: '25565'
      CRAFTLE_MC_VERSION: '1.21.1'
      CRAFTLE_CONTINUOUS_AGENT: '1'
      CRAFTLE_CAMERA_MODE: third_person
      CRAFTLE_TARGET_REWARD_VERSION: 'v1'
      CRAFTLE_SPECTATOR_EFFECTS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    volumes:
      - ./state/agent:/state/agent
    init: true
    stop_grace_period: 60s
secrets:
  rcon_password:
    file: ../persistent/secrets/rcon_password.txt

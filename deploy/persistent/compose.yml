name: craftle-persistent
services:
  minecraft:
    image: itzg/minecraft-server:java21
    restart: unless-stopped
    ports:
      - '127.0.0.1:25565:25565'
    environment:
      EULA: 'TRUE'
      TYPE: VANILLA
      VERSION: '1.21.1'
      ONLINE_MODE: 'FALSE'
      MODE: survival
      DIFFICULTY: normal
      MEMORY: '${CRAFTLE_MC_MEMORY:-3G}'
      SEED: '20261205'
      SPAWN_PROTECTION: '0'
      ENABLE_RCON: 'true'
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      MAX_PLAYERS: '12'
    volumes:
      - ./state/server:/data
    secrets:
      - rcon_password
    healthcheck:
      test: ['CMD', 'mc-health']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    stop_grace_period: 60s
  agent:
    profiles: [learning]
    ports:
      - '127.0.0.1:3000:3000'
      - '127.0.0.1:3001:3001'
    build:
      context: ../..
      dockerfile: deploy/persistent/agent.Dockerfile
      args:
        CRAFTLE_CUSTOM_VIEWER: '${CRAFTLE_CUSTOM_VIEWER:-0}'
        CRAFTLE_VIEWER_CAMERA_BUILD: '${CRAFTLE_VIEWER_CAMERA_BUILD:-director}'
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      CRAFTLE_PERSISTENT_ROOT: /state/agent
      CRAFTLE_SERVER_HOST: minecraft
      CRAFTLE_SERVER_PORT: '25565'
      CRAFTLE_MC_VERSION: '1.21.1'
      CRAFTLE_PERSISTENT_SESSION_MS: '180000'
      CRAFTLE_CONTINUOUS_AGENT: '${CRAFTLE_CONTINUOUS_AGENT:-0}'
      CRAFTLE_REFERENCE_WIDTH: '${CRAFTLE_REFERENCE_WIDTH:-256}'
      CRAFTLE_REFERENCE_HEIGHT: '${CRAFTLE_REFERENCE_HEIGHT:-256}'
      CRAFTLE_CAMERA_MODE: '${CRAFTLE_CAMERA_MODE:-first_person}'
      CRAFTLE_SPECTATOR_EFFECTS: '${CRAFTLE_SPECTATOR_EFFECTS:-1}'
      CRAFTLE_TARGET_REWARD_VERSION: '${CRAFTLE_TARGET_REWARD_VERSION:-v1}'
      CRAFTLE_THIRD_PERSON_PORT: '3000'
      LIBGL_ALWAYS_SOFTWARE: '1'
    volumes:
      - ./state/agent:/state/agent
    init: true
    stop_grace_period: 60s
secrets:
  rcon_password:
    file: ./secrets/rcon_password.txt
